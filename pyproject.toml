[project]
name = "ziemlichwarmhier"
version = "0.1.0"
description = ""
authors = [
    {name = "Sebastian Fast",email = "s.fast@cognigy.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "requests (>=2.32.4,<3.0.0)",
    "bs4 (>=0.0.2,<0.0.3)",
    "matplotlib (>=3.10.3,<4.0.0)",
    "xarray (>=2025.6.1,<2026.0.0)",
    "numpy (>=2.3.0,<3.0.0)",
    "boto3 (>=1.38.39,<2.0.0)",
    "tqdm (>=4.67.1,<5.0.0)",
    "ephem (>=4.2,<5.0)",
    "netcdf4 (>=1.7.2,<2.0.0)",
    "scipy (>=1.17.1,<2.0.0)",
    "mercantile (>=1.2.1,<2.0.0)"
]

[project.optional-dependencies]
test = [
    "pytest (>=8.0,<9.0)",
    "pytest-cov (>=6.0,<7.0)",
]

[tool.pytest.ini_options]
testpaths = [
    "analysis/tests",
    "analysis/era5/tests",
    "analysis/tiles/tests",
    "analysis/metrics/tests",
]
pythonpath = [
    ".",
    "analysis/stations",
    "analysis/hyras",
    "analysis/rolling_average",
    "analysis/utilities",
    "analysis/geonames",
]
addopts = [
    "--strict-markers",
    "--tb=short",
    "-q",
]
markers = [
    "network: marks tests requiring network access (deselect with '-m \"not network\"')",
    "slow: marks tests that take more than a few seconds",
]

[tool.coverage.run]
source = ["analysis"]
omit = ["analysis/tests/*"]

[tool.coverage.report]
fail_under = 10
show_missing = true



[tool.poetry.group.dev.dependencies]
shapely = "^2.1.2"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
