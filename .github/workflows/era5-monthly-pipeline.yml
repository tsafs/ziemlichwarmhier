name: ERA5 Monthly Pipeline

on:
  schedule:
    - cron: "0 4 1 * *" # 1st of every month at 04:00 UTC
  workflow_dispatch:
    inputs:
      target_year:
        description: "Year to process (e.g. 2025). Defaults to previous month's year."
        required: false
        default: ""
        type: string
      target_month:
        description: "Month to process (1-12). Defaults to previous month."
        required: false
        default: ""
        type: string

jobs:
  run-era5-monthly:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull ERA5 monthly Docker image
        run: docker pull ghcr.io/tsafs/itishotnow:era5-monthly-latest

      - name: Run ERA5 monthly pipeline
        run: |
          docker run --rm \
            -e CDS_API_KEY="${{ secrets.CDS_API_KEY }}" \
            -e ACCESS_KEY="${{ secrets.S3_ACCESS_KEY }}" \
            -e SECRET_KEY="${{ secrets.S3_SECRET_KEY }}" \
            -e ENDPOINT_URL="${{ secrets.S3_ENDPOINT_URL }}" \
            -e BUCKET_NAME="${{ secrets.BUCKET_NAME }}" \
            -e TARGET_YEAR="${{ github.event.inputs.target_year }}" \
            -e TARGET_MONTH="${{ github.event.inputs.target_month }}" \
            ghcr.io/tsafs/itishotnow:era5-monthly-latest

      - name: Create GitHub issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE=$(date -u +"%Y-%m-%d")
          gh issue create \
            --title "ERA5 Monthly Pipeline Failed - ${DATE}" \
            --body "The ERA5 monthly pipeline failed on ${DATE}. See the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details." \
            --label "bug,automated"
