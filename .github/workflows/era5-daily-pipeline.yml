name: ERA5 Daily Pipeline

on:
  schedule:
    - cron: "15 3 * * *" # Daily at 03:15 UTC
  workflow_dispatch:
    inputs:
      force_reprocess:
        description: "Force reprocessing even if tiles already exist in S3"
        required: false
        default: "false"
        type: boolean

jobs:
  run-era5-daily:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull ERA5 daily Docker image
        run: docker pull ghcr.io/tsafs/itishotnow:era5-daily-latest

      - name: Run ERA5 daily pipeline
        run: |
          docker run --rm \
            -e CDS_API_KEY="${{ secrets.CDS_API_KEY }}" \
            -e ACCESS_KEY="${{ secrets.S3_ACCESS_KEY }}" \
            -e SECRET_KEY="${{ secrets.S3_SECRET_KEY }}" \
            -e ENDPOINT_URL="${{ secrets.S3_ENDPOINT_URL }}" \
            -e BUCKET_NAME="${{ secrets.BUCKET_NAME }}" \
            -e FORCE_REPROCESS="${{ github.event.inputs.force_reprocess || 'false' }}" \
            ghcr.io/tsafs/itishotnow:era5-daily-latest

      - name: Create GitHub issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE=$(date -u +"%Y-%m-%d")
          gh issue create \
            --title "ERA5 Daily Pipeline Failed - ${DATE}" \
            --body "The ERA5 daily pipeline failed on ${DATE}. See the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details." \
            --label "bug,automated"
